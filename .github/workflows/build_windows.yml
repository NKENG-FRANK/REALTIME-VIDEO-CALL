name: Build Windows App

on:
  push:
    branches: [ frank, main, master ]
  pull_request:
    branches: [ frank, main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions web interface

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop build
        run: flutter config --enable-windows-desktop

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: videocall
        run: flutter pub get

      - name: Build Windows release executable
        working-directory: videocall
        run: flutter build windows --release --verbose

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: callwave-windows-release
          path: videocall/build/windows/x64/runner/Release/
          if-no-files-found: error
