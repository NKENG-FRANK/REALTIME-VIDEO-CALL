version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: callwave-db
    environment:
      POSTGRES_DB: callwave
      POSTGRES_USER: callwave_user
      POSTGRES_PASSWORD: callwave_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - callwave-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwave_user -d callwave"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callwave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - callwave-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  callwave-network:
    driver: bridge
